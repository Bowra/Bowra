<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">Bowra workflow — Verified Intelligence</title>
  <desc id="workflow-desc">Sources flow through specialist agents and tools to evidence review and then a report. Sources include authorized data and documents. Reports can be shared, revised, or exported.</desc>
