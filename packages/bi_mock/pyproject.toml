[project]
name = "bi-mock"
version = "0.4.5"
description = "Bowhead BI Mock Server — 模拟真实 BI 供开发/测试使用"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bi_mock"]
