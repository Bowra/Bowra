[project]
name = "bowhead-bi-bridge"
version = "0.4.5"
description = "Bowhead BI Bridge — BI API 封装 + MCP Server 对外"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2==2.16.0",
    "pydantic>=2.14.1",
    "anyio>=4.15.1",
    "mcp>=2.3.0",                 # Model Context Protocol SDK
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bowhead_bi_bridge"]
