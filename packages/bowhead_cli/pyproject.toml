[project]
name = "bowhead-cli"
version = "0.4.5"
description = "Bowhead CLI — db init/migrate, workspace bootstrap, trace dump"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "alembic>=1.14.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "anyio>=4.15.1",
    "pyjwt>=2.15.1",
    "bowhead-core",
    "bowhead-skill",
    "bowhead-memory",
]

[project.scripts]
bowhead = "bowhead_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bowhead_cli"]
