# Code-shipped built-in Plugins (docs/design/capability-center-plugins-tech-design.md §5).
#
# A Plugin is a reviewed bundle of Tools, system parts and exact Skill grants.
# Entries are immutable: changing a Plugin's contents requires a new version,
# and older versions stay listed so existing snapshots keep resolving.
#
# family:
#   general  - user-visible Tools (kind: tool), optional prompt modules (<id>@<version>)
#              and availability requirements; needs a listing in zh-CN, en-US, de-DE and fr-FR
#              with a name, a description, a "use when" line and one example request.
#   settings - used by the configuration Agent; carries system parts and one exact Skill grant.
# selectable:
#   whether custom Agents may select the Plugin: every general Plugin is selectable, settings
#   Plugins never are. Selecting a Plugin is the Owner's grant: its Tools run without asking
#   each time (Email and Google delivery included; Lead keeps its own confirmation).
# A Tool belongs to at most one Plugin.
schema_version: 1

plugins:
  - name: data-analysis
    version: 1
    family: general
    selectable: true
    listing:
      zh-CN:
        {
          name: "数据分析",
          description: "查看数据字段、查询数据并确认数据口径。",
          use_when: "要从团队的数据源里查数时",
          example: "「上月华东销售额是多少」",
        }
      en-US:
        {
          name: "Data analysis",
          description: "View data fields, query data and clarify data terms.",
          use_when: "you need numbers from your team's data sources",
          example: '"What were East China sales last month?"',
        }
      de-DE:
        {
          name: "Datenanalyse",
          description: "Datenfelder ansehen, Daten abfragen und Datenbegriffe klären.",
          use_when: "Sie Zahlen aus den Datenquellen Ihres Teams brauchen",
          example: "„Wie hoch war der Umsatz in Ostchina im letzten Monat?“",
        }
      fr-FR:
        {
          name: "Analyse de données",
          description: "Consulter les champs, interroger les données et clarifier les termes métier.",
          use_when: "vous avez besoin de chiffres issus des sources de données de l’équipe",
          example: "« Quelles étaient les ventes de la Chine de l’Est le mois dernier ? »",
        }
    tools: [bi_schema, bi_query, bi_concept_resolve, tool_list_workspaces]
    prompt_modules: [data-query-datarc-protocol@1]
    availability: [datarc_connection]
  - name: reports-canvas
    version: 1
    family: general
    selectable: true
    listing:
      zh-CN:
        {
          name: "报告与画布",
          description: "把分析写成报告，加入图表、图片和洞察。",
          use_when: "要把结果做成带图表的报告时",
          example: "「把这季度的销售情况写成一份带图表的报告」",
        }
      en-US:
        {
          name: "Reports and canvas",
          description: "Write analysis into reports with charts, images and insights.",
          use_when: "you want the result as a report with charts",
          example: '"Write this quarter''s sales into a report with charts"',
        }
      de-DE:
        {
          name: "Berichte und Canvas",
          description: "Analysen als Berichte mit Diagrammen, Bildern und Erkenntnissen schreiben.",
          use_when: "Sie das Ergebnis als Bericht mit Diagrammen möchten",
          example: "„Fasse den Umsatz dieses Quartals in einem Bericht mit Diagrammen zusammen“",
        }
      fr-FR:
        {
          name: "Rapports et canevas",
          description: "Rédiger l’analyse en rapports avec graphiques, images et constats.",
          use_when: "vous voulez le résultat sous forme de rapport avec graphiques",
          example: "« Rédige un rapport avec graphiques sur les ventes de ce trimestre »",
        }
    tools:
      [
        write_report,
        read_report,
        add_chart,
        remove_chart,
        add_image,
        canvas_add_insight,
        canvas_add_spec_block,
        canvas_add_html_artifact,
        canvas_add_external_iframe,
      ]
    prompt_modules: [canvas-report-protocol@1]
  - name: designs
