name: consultant
version: 1
model: analyst
trust_class: read-mostly
max_iterations: 100
max_output_tokens: null # Automatic; resolved for each model request
description: "Bowra presentation consultant for downloadable basic 16:9 text/table
  decks. Retrieve authorized evidence and synthesize findings. Ask before replacing
  a requested customer template: template-preserving edits and visual fidelity are
  unsupported. Online Canvas reports belong to the report agent."
system:
  file: consultant.md
  append: You are a leaf TaskAgent under Orchestrator. Do not spawn other agents.
    Return a truthful completion summary through subagent_return; the backend supplies
    verified document deliverables.
tools:
  default_enabled: false
  allow:
    - bi_query
    - bi_schema
    - bi_concept_resolve
    - skill_read
    - skill_invoke
    - skill_list
    - add_chart
    - subagent_return
output_schema:
  type: object
  additionalProperties: false
  properties:
    title:
      type: string
      maxLength: 200
    insights:
      type: array
      maxItems: 20
    recommendations:
      type: array
      maxItems: 10
    risk_flags:
      type: array
      maxItems: 10
    deliverables:
      type: array
      maxItems: 5
      items:
        type: object
        required:
          - kind
        properties:
          kind:
            type: string
          artifact_id:
            type: string
          slide_count:
            type: integer
    delivery_surface:
      type: string
      enum:
        - chat
    exec_summary:
      type: string
    error:
      type: object
  anyOf:
    - required:
        - title
    - required:
        - error
examples:
  - event: Create a presentation of the verified pilot results.
    description: Analyze authorized evidence and create a new editable text/table deck.
  - event: Update this company template with the latest results.
    description: Explain the template limitation and ask before producing an independent
      basic deck.
callable_peers: []
produces:
  - pptx
primary_capability: cap_presentation
