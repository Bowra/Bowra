name: lead
version: 1
model: lead
trust_class: read-mostly
max_iterations: 12
max_output_tokens: null
description: "Bowhead Lead orchestrator — single entry point for all chat turns.

  Self-answers simple queries (chat / concept with active_facts), dispatches

  middle tools (kb.* / bi.*), invokes callable_peers for complex analysis.

  Lean system prompt built per-turn in-memory

  via prompts/lead.py.

  "
system: null
tools:
  default_enabled: false
  allow:
    - present_artifacts
    - bi_schema
    - bi_query
    - kb_search
    - kb_list_tables
    - kb_query_records
    - kb_get_record
    - kb_add_file
    - kb_remove_file
    - kb_operation_status
    - web_search
    - web_fetch
    - web_extract
    - skill_list
    - skill_save_generated
    - tool_creator
    - subagent_creator
    - workflow_creator
    - scheduled_job_create
    - config_read
    - config_propose
    - clarification_ask
    - feedback_escalate
    - send_email
    - get_current_user
    - google_doc_write
    - google_slides_write
    - google_sheet_write
    - plan_propose
    - tool_switch_context
    - tool_list_workspaces
    - remember
    - recall
    - bi_concept_resolve
    - subagent_spawn
    - subagent_return
callable_peers:
  - agent-coach
  - configuration-agent
  - kb-analyst
  - compute
  - financial-analyst
  - business-analyst
  - compliance-analyst
  - consultant
  - marketing-analyst
input_schema:
  type: object
  additionalProperties: false
  required:
    - user_question
  properties:
    user_question:
      type: string
      maxLength: 4000
    workspace_id:
      type: string
      maxLength: 64
    project_id:
      type: string
      maxLength: 64
    kb_role:
      type: string
      maxLength: 32
      description: user-scoped (private) / workspace-shared (team-shared)
output_schema:
  type: object
  additionalProperties: false
  required:
    - final_answer
    - status
  properties:
    final_answer:
      type: string
      maxLength: 16000
    status:
      type: string
      enum:
        - completed
        - clarification_pending
        - aborted
        - error
    sections_count:
      type: integer
      minimum: 0
      maximum: 50
    used_peers:
      type: array
      items:
        type: string
        maxLength: 64
      maxItems: 6
examples:
  - event: "用户: '你好' → Lead self-answer prose, 0 tool calls, 0 peer invocations"
    description: 闲聊路径 — Step 2 of decision tree, prose answer
  - event: "用户: '4月营业额' → Lead → bi.list_measures → bi.schema → bi.query → narrate"
    description: 数据 lazy-fetch 路径 (Spike
  - event: "用户: '查一下' → Lead → clarification.ask (sentinel) → turn_aborted with candidates"
    description: 模糊 query 路径 — heuristic + LLM hybrid (Spike
  - event: "用户: '把这份合同写成在线报告' → Lead → kb-analyst peer → 1 turn 出"
    description: 复合 query 路径 (S2 single-turn composite)
