# Sprint ω Phase 4 — single source of truth for tool names + display + roles.
#
# Codegen: `uv run python -m bowhead_cli.codegen_tool_aliases` produces:
#   - packages/bowhead_core/src/bowhead_core/agents/_generated/tool_names.py
#       Python constants (`BI_QUERY = "bi_query"`) — prompts import these
#   - packages/bowhead_core/src/bowhead_core/agents/_generated/role_bindings.py
#       `_PARADIGM_V2_ROLE_MAP` — overrides inline literal in tool_registry.py
#   - packages/bowhead_core/src/bowhead_core/agents/_generated/legacy_trace_names.py
#       `LEGACY_TRACE_NAMES` map for §2.13 trace replay display normalize
#   - packages/bowhead_frontend/lib/_generated/tool-display.ts
#       TS map `TOOL_DISPLAY: Record<string, ToolDisplay>` for frontend
#
# Hard exclusion (NEVER renamed by codegen): Prometheus metric label
# `bowhead_bi_query_url_only_total` at `tool_registry.py:1334` — dashboard-bound.
# r3.1 §2.3 invariant.

# ⚠ Retirement completed on 2026-09-05 (tool-inventory sprint). The BI tools sunset since omicron above
# （bi_attribute / bi_breakdown / bi_explain / bi_get_card / bi_get_cards /
# bi_plan_query / bi_call_llm_async / bi_get_llm_result / bi_fetch_account /
# bi_fetch_rows) **were retired in the correct order from the 2026-07-21 audit**: first remove tool_registry.py
# registration points and handlers, then delete entries here and move their names into `retired:` below.
# All three objections from that audit no longer apply:
#   - Handlers still exist: they were removed too (except bi_fetch_rows, whose `_fetch_rows`
#     is bi_query's sole implementation path; retain that function and remove only registration).
#   - Deleting entries restores allowed_for_roles to the default three roles: these tools are unregistered, so nothing can widen.
#   - ALL_TOOL_NAMES reserves names against user skills: names move into `retired:` and remain reserved in
#     RESERVED_TOOL_NAMES, still preventing user-skill collisions.
# Criteria and release gate: docs/sprints/tool-inventory-2026-09-04/dead-tool-inventory.md.
#
# The two legacy_alias entries under `bi_schema` (bi_list_measures / bi_list_dimensions)
# **remain separately registered** (each has a handler, visible_to_llm=False), so retain their entries.

# ─── User-facing copy (display_* / blurb_*) ────────────────────────────
# These four fields describe tools **as customers see them**. Chinese/English pairs are required; codegen rejects missing halves.
#
#   display_zh / display_en: names used in step cards, chips, and agent-creation tool selection.
#   blurb_zh   / blurb_en: one-sentence explanations used only in tool-selection lists.
#   display_de / blurb_de: optional German names/explanations. Generated output uses English placeholders when omitted
#                              (German UI shows English, never Chinese); fill both fields when translated.
#   display_fr / blurb_fr: optional French names/explanations, with the same English-placeholder rule as German.
#
# Two mandatory constraints:
#   1. **Use everyday language, not implementation terms.** Avoid sandbox / artifact / schema / iframe / KB /
#      spec block / patch / flatten / payload and similar internal terms unfamiliar to customers.
#      Use the full Datarc workspace name, never the abbreviated workspace term (docs/design/概念术语.md:
#      standalone Chinese "工作区" refers to a Space in user-facing copy, whereas this is a data-source context).
#   2. **Do not copy ToolSchema.description.** It is protocol text for the model
#      (`NL → datarc rows. 批量传 queries: List[str]`), which customers cannot understand.
#      Before capability-surface-audit on 2026-09-06, the selection list displayed that text and raw codes.
#
# Quote sentences containing colons; otherwise YAML interprets them as mapping separators (this table previously hit that issue).
#
# ─── Field semantics ─────────────────────────────────────────────────
# `legacy_aliases` and `renamed_from` are **different concepts**; do not conflate them
# (authoritative specification: docs/design/工具改名迁移.md).
#
#   legacy_aliases: old names historically **registered separately** (such as bi_ask_question). Each
#     still has its own handler (visible_to_llm=False); normalization is for **display only**.
#     Wiring these into runtime would **replace dispatch targets**, a behavior change rather than a rename.
#
#   renamed_from: **pure rename**; the old name does not and will not have its own ToolSpec.
#     All name-based checks normalize it to the current name **during resolution** (TOOL_RENAMES).
#     Supports renamed tools whose old names persist in customer-created agents' prompts / tool_refs.
#     Old names enter ALL_TOOL_NAMES (reserved against user-skill collisions), but **not role bindings**;
#     they are never registered. Binding roles would leak them into NATIVE_ALLOWLIST as
#     ghost rows whose selection has no effect (the bi_ask_question example in specification §4).
#
# ─── Resource kind and risk (docs/design/capability-center-plugins-tech-design.md §4.1) ───
#   kind: required. `tool` = user-visible built-in Tool (Tools page, Plugins, Agent selection);
#     `part` = internal system part, never shown, selected or disabled on its own.
#   risk: required for `kind: tool`; one of read / compute / artifact_write / external_write / destructive.
#     A part may carry the risk the authoring catalog already gave it, so that catalog stays unchanged.

