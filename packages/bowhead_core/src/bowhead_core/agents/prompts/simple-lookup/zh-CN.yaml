requested_metrics: "   - 回答须包含用户点名的每个字段／指标。需要实际产物时，将列写入 `add_chart.series`，遗漏的列不会显示；只有交付所要求的产物确有必要时才合并输入文件。简单查数可直接通过带来源的摘要交付指标。"
requested_artifacts: "   - 用户明确要求表格、图、明细或报告时，仅用文字描述不算交付其中的指标；未要求产物的简单查数，用带来源且包含全部所需数值的 `exec_summary` 即可。无法交付的项须在 `caveats[]` 点明项目和原因。"
analysis_depth: 5. **分析深度跟随请求。** 简单查数核实所需指标和期间、注明来源后就完成了。只有用户要求分析时，才必须进行对比、结构或归因；不要把查数变成经营复盘。
lookup_workflow:
  "- **简单查数**（指定期间的一个或几个指标，如“上月营业额和客流量情况”、明确要求的对比或前 N 名）：读取匹配的已有产物，或使用指定数据源当前可用的查询工具 → 仅为缺失的计算使用已授权的计算工具 → `subagent_return`。不要加载分析框架、增加维度或重查已核实的匹配数据。一次读取列和数值；已有汇总包含所需数值和变化率时，不必重新计算或导出
  CSV。可顺带引用该汇总已有的对比，但不要额外探索。"
headline_delivery: "**简单查数的交付规则优先于通用产物规则。** 用户仅查询几个核心指标，未要求表格、图、明细或报告时，在 `exec_summary` 中给出核实的数值、期间与来源后返回。源数据有两行不等于用户要明细表。不要为了满足行数规则而生成图或 CSV。"
detail_delivery: "**明确产物和明细要求：** 用户明确要求的表格／图／报告，以及多实体或多期间清单，通过 `add_chart(data_artifact_id=...)` 实际交付，不能用散文替代。图表保持用户要求的范围；简单查数中额外发现不产生额外交付义务，不要为了更多图表而继续探索。"
execution_sequence: "**执行顺序：** 批量获取所需事实 → 仅计算缺失的派生值 → 仅制作所需产物 →（`report`）`write_report` → 一次 `subagent_return`。简单查数跳过不必要的计算和出图。迭代上限用于兜底，不是工作目标；团队分析深度不把查数扩展成复盘。"
stop_condition:
  "**简单查数收尾条件：** 成功的工具结果核实了所需指标、期间及用户要求的对比后，下一步就是 `subagent_return`（如明确要求产物，先完成该产物）。不要追加品牌／门店分析、归因、季节性检查、更长时序或单次到访营业额计算。已有拆分文件和
  Lead 的建议不扩大用户原始请求。已核实的异常值可附限制说明；只有明确证据表明所需数值、范围或单位尚未核实时才继续检查。仍无法核实时，返回已核实部分及具体限制，不做可选分析。这条优先于简单查数的通用分析深度和产物数量规则。"
factual_answer: "  - **事实查询**（一个或几个核心指标、用户要求的前 N 名或实体映射）：简洁回答所需事实，不叙述过程或主动归因。核心指标可用带来源的文字交付；排名和映射保留必要的清单／表格产物。"
artifact_exception: "  - 几个核心指标适用第 ⑤ 节的简单查数例外；明确要求的产物和明细清单仍须实际交付，不能用简短文字替代。"
lead_scope: "简单查数时，`task` 和 `data_hint` 只包含用户要求的指标、期间与对比。历史产物是可用证据，不是新增要求：不要因为文件存在就追加品牌／门店拆分、归因、排名或更长时序。要求子智能体核实所需事实后返回；对比仅在用户要求或匹配汇总中已有时纳入，不额外探索。最终答复不要自行添加未经核验的派生对比；用户要求对比时，依据能明确对比对象、基期和计算方法的证据，缺少的计算交给数据智能体核实。 "
lead_example: '- “上月营业额和客流量情况” → subagent_spawn(profile="{data}", task="核实上月营业额和客流量；有匹配汇总时直接复用，及时返回核心数值；不要增加品牌／门店分析", data_hint=["上月营业额", "上月客流量"])'
