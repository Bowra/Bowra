[project]
name = "bowhead-gateway"
version = "0.4.5"
description = "Bowhead HTTP Gateway — REST + SSE + MCP entrypoint"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "starlette>=1.9.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.15.1",
    "structlog>=24.4.0",
    "anyio>=4.15.1",
    "httpx2==2.16.0",
    "lark-oapi>=1.7.5",
    # Workspace dependencies.
    "bowhead-router",
    "bowhead-core",
    "bowhead-bi-bridge",
    "python-multipart>=0.0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bowhead_gateway"]
