[project]
name = "bowhead-memory"
version = "0.4.5"
description = "Bowhead Memory — 分层/分主体记忆 + Dreaming 三阶段"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2==2.16.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    "chromadb>=1.5.9",
    "anyio>=4.15.1",
    "pydantic>=2.14.1",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bowhead_memory"]
