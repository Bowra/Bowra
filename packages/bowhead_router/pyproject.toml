[project]
name = "bowhead-router"
version = "0.4.5"
description = "Bowhead LLM Router — Provider-Neutral adapter framework"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2==2.16.0",
    "anyio>=4.15.1",
    "pydantic>=2.14.1",
    "jinja2>=3.1.4",          # custom_http template rendering
    "jsonpath-ng>=1.6.0",     # response_mapping JSONPath
    "pyyaml>=6.0.2",          # config_loader reads routing.dev.yaml
    "structlog>=24.4.0",
    "tiktoken>=0.8",         # shared token estimates for input and output budgets
]

[project.optional-dependencies]
# Optional SDK dependencies.
openai    = ["openai>=3.36.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bowhead_router"]
