[project]
name = "bowhead"
version = "0.4.5"
description = "Bowra: evidence-backed AI agents and team workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-anyio>=0.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-xdist>=3.6.0",
    "respx>=0.21.0",
    "testcontainers>=4.7.0",
    "httpx2==2.16.0",
    "ipython>=8.0.0",
    "aiosmtpd>=1.4.0",
    "pytest-timeout>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv.workspace]
members = [
    "packages/bowhead_core",
    "packages/bowhead_router",
    "packages/bowhead_gateway",
    "packages/bowhead_memory",
    "packages/bowhead_skill",
    "packages/bowhead_bi_bridge",
    "packages/bi_mock",
    "packages/bowhead_cli",
]

[[tool.uv.index]]
url = "https://mirrors.tencent.com/pypi/simple/"
default = true

[tool.uv.sources]

bowhead-core       = { workspace = true }
bowhead-router     = { workspace = true }
bowhead-gateway    = { workspace = true }
bowhead-memory     = { workspace = true }
bowhead-skill      = { workspace = true }
bowhead-bi-bridge  = { workspace = true }
bi-mock            = { workspace = true }
bowhead-cli        = { workspace = true }

[tool.ruff]
target-version = "py312"
src = ["packages"]

extend-exclude = ["**/migrations/**", "**/.venv/**", "**/_generated/**"]
line-length = 150
lint.select = [
        "F",
    "E", "W",
    "I",

    "UP",
    "S",
    "B",
    "A",
    "C4",
    "ICN",
    "G",
    "PIE",
    "T20",
    "RET",
    "SIM",
    "TID",
    "PTH",
    "PD",

    "NPY",
    "RUF100",
]
lint.ignore = [
    "E501",
    "S101",
    "S104",
    "S106",
    "S107",
    "S108",
    "RUF002",
    "RUF003",
    "PLR0913",
    "PLR2004",
    "PLC0415",
    "E402",
    "A003",
    "A005",
    "B005",
    "B904",
    "B905",
    "B008",
    "E501",
    "RET504",
    "RUF100",
    "S105",
    "S106",
    "S311",
    "S603",
    "S608",
    "SIM102",
    "SIM108",
    "S307",
    "S324",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["packages/bi_mock/src"]
addopts = [
    "-p",
    "bowhead_cli.pytest_httpx2",
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov-config=pyproject.toml",

]
markers = [
    "unit: unit test (no I/O)",
    "integration: integration test (requires Redis or the BI mock)",
    "live: requires external API credentials",
    "slow: test taking more than two seconds",
]
asyncio_mode = "auto"

tmp_path_retention_policy = "failed"

timeout = 120
timeout_method = "signal"

faulthandler_timeout = 150

[tool.coverage.run]
branch = true
source = ["packages"]
omit = ["**/tests/**", "**/__init__.py"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "bi-mock",
    "bowhead-cli",
    "openai>=3.36.1",

    "pandas>=3.1.0,<4",
    "pdfplumber>=0.11.9",
    "psutil>=7.2.2",
    "reportlab>=5.1.0",
]
